x-app: &app
  build:
    context: ./apps/api/vendor/laravel/sail/runtimes/8.5
    dockerfile: Dockerfile
    args:
      WWWGROUP: '${WWWGROUP:-1000}'
  image: sail-8.5/app
  restart: unless-stopped
  env_file: ./apps/api/.env
  volumes:
    - ./apps/api:/var/www/html
  networks:
    - sail

services:
  laravelnuxt.api:
    <<: *app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      OCTANE_HOST: '0.0.0.0'
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      APP_ENV: '${APP_ENV:-local}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      SUPERVISOR_PHP_COMMAND: '${SUPERVISOR_PHP_COMMAND:-php artisan octane:start --watch}'
      OCTANE_PORT: '${OCTANE_PORT:-9000}'
    ports:
      - '${HOST_BIND:-0.0.0.0}:${API_PORT:-9000}:${OCTANE_PORT:-9000}'
    depends_on: [laravelnuxt.redis]

  laravelnuxt.schedule:
    <<: *app
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      APP_ENV: '${APP_ENV:-local}'
      SUPERVISOR_PHP_COMMAND: 'php artisan schedule:work'
    depends_on: [laravelnuxt.api, laravelnuxt.redis]

  laravelnuxt.queue:
    <<: *app
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      APP_ENV: '${APP_ENV:-local}'
      SUPERVISOR_PHP_COMMAND: 'php artisan queue:work'
    depends_on: [laravelnuxt.api, laravelnuxt.redis]

  laravelnuxt.redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - sail
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  laravelnuxt.web:
    image: oven/bun:1
    restart: unless-stopped
    working_dir: /app
    command: ${WEB_COMMAND:-bun --bun run dev}
    env_file: ./apps/web/.env
    volumes:
      - ./apps/web:/app
    networks:
      - sail
    ports:
      - "${HOST_BIND:-0.0.0.0}:${WEB_PORT:-4000}:${NUXT_PORT:-4000}"

  martin:
    image: maplibre/martin:latest
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-0.0.0.0}:${MARTIN_PORT:-9090}:9090"
    environment:
      - DATABASE_URL=postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/${DB_DATABASE:-db_melarosa}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - sail

networks:
  sail:
    driver: bridge

volumes:
  redisdata:
